name: Windows tests and portable build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Offline unit tests (no camera or live input)
        run: python -m unittest discover -s tests -v
      - name: Build portable Windows package
        run: python build_release.py --output dist
      - name: Synthetic camera helper test (no hardware access)
        shell: pwsh
        run: |
          $result = & .\dist\DeskGuard\_app\CameraHost.exe --self-test
          if ($LASTEXITCODE -ne 0 -or -not ($result -match '^PHOTO ')) {
            throw 'Synthetic camera helper test failed.'
          }
      - name: Upload portable package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DeskGuard-Windows
          path: |
            dist/DeskGuard-Windows.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
