name: Windows tests and portable build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Offline unit tests (no camera or live input)
        run: python -m unittest discover -s tests -v
      - name: Build portable Windows package
        run: python build_release.py --output dist
      - name: Verify executable version and icon assets
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          foreach ($path in @('dist/DeskGuard/DeskGuard.exe', 'dist/DeskGuard/_app/CameraHost.exe', 'dist/DeskGuard/_app/PetHost.exe')) {
            $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path -LiteralPath $path).Path)
            if ($info.FileVersion -ne "$version.0" -or $info.ProductVersion -ne $version) {
              throw "Version metadata mismatch: $path"
            }
          }
          foreach ($name in @('deskguard.ico', 'deskguard.png', 'deskguard-pet.png', 'deskguard-pet-step.png')) {
            $source = (Get-FileHash -LiteralPath "assets/$name" -Algorithm SHA256).Hash
            $packaged = (Get-FileHash -LiteralPath "dist/DeskGuard/assets/$name" -Algorithm SHA256).Hash
            if ($source -ne $packaged) { throw "Packaged icon mismatch: $name" }
          }
          Add-Type -AssemblyName System.Drawing
          foreach ($name in @('deskguard-pet.png', 'deskguard-pet-step.png')) {
            $pet = [System.Drawing.Bitmap]::new((Resolve-Path -LiteralPath "dist/DeskGuard/assets/$name").Path)
            try {
              if ($pet.GetPixel(0, 0).A -ne 0) { throw "Pet artwork must retain transparent corners: $name" }
            } finally { $pet.Dispose() }
          }
      - name: Native pet asset and renderer test (no window)
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'deskguard-pet-self-test.json'
          $exe = (Resolve-Path -LiteralPath 'dist/DeskGuard/_app/PetHost.exe').Path
          $first = (Resolve-Path -LiteralPath 'dist/DeskGuard/assets/deskguard-pet.png').Path
          $second = (Resolve-Path -LiteralPath 'dist/DeskGuard/assets/deskguard-pet-step.png').Path
          $process = Start-Process -FilePath $exe -ArgumentList @('--self-test', ('"' + $report + '"'), ('"' + $first + '"'), ('"' + $second + '"')) -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            if (Test-Path -LiteralPath $report) { Get-Content -LiteralPath $report }
            throw 'Native pet renderer test failed.'
          }
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if (-not $result.passed -or -not $result.transparent_corner -or -not $result.body_opaque -or -not $result.turns_at_edges) {
            throw 'Native pet renderer produced invalid alpha.'
          }
      - name: Synthetic camera helper test (no hardware access)
        shell: pwsh
        run: |
          $result = & .\dist\DeskGuard\_app\CameraHost.exe --self-test
          if ($LASTEXITCODE -ne 0 -or -not ($result -match '^PHOTO ')) {
            throw 'Synthetic camera helper test failed.'
          }
      - name: Upload portable package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DeskGuard-Windows
          path: |
            dist/DeskGuard-Windows.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
